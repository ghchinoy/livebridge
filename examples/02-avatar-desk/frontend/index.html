<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 · Avatar Desk — @ghchinoy/livebridge</title>
    <style>
      :root {
        --bg: #090d16;
        --panel: #111827;
        --border: #1f2937;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 1.25rem;
      }
      .layout {
        max-width: 1120px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 1.25rem;
      }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }
      .stage {
        position: relative;
        aspect-ratio: 9 / 16;
        max-height: 560px;
        background: #030712;
        border-radius: 12px;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      video#avatar-video { width: 100%; height: 100%; object-fit: cover; }
      video#pip-video {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 112px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: #000;
        display: none;
      }
      label { font-size: 0.8rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.3rem; }
      select, input[type='text'] {
        padding: 0.5rem 0.7rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #030712;
        color: var(--text);
      }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      button {
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #1f2937;
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #082f49; border-color: transparent; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #transcript {
        flex: 1;
        min-height: 360px;
        max-height: 520px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 0.75rem;
        background: #030712;
        border-radius: 12px;
      }
      .bubble { padding: 0.55rem 0.8rem; border-radius: 10px; max-width: 85%; font-size: 0.92rem; }
      .bubble.user { align-self: flex-end; background: #1d4ed8; }
      .bubble.assistant { align-self: flex-start; background: #1f2937; }
      .hint { font-size: 0.78rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="layout">
      <section class="card">
        <div class="stage">
          <video id="avatar-video" playsinline autoplay></video>
          <video id="pip-video" playsinline autoplay muted></video>
        </div>
        <div class="row">
          <label style="flex: 1">
            Mode
            <select id="mode-select">
              <option value="avatar">Talking Video Avatar (fMP4)</option>
              <option value="audio">Audio Only (24 kHz PCM)</option>
            </select>
          </label>
          <label style="flex: 1">
            Preset Avatar
            <select id="avatar-select">
              <option value="Kira">Kira</option>
              <option value="Puck">Puck</option>
              <option value="Aoede">Aoede</option>
              <option value="Kore">Kore</option>
            </select>
          </label>
        </div>
        <label>
          Or Upload Custom Avatar Portrait/Landscape (auto-cropped via prepareAvatarImage)
          <input id="custom-file" type="file" accept="image/png,image/jpeg,image/webp" />
        </label>
        <div id="crop-status" class="hint">Using preset avatar.</div>
      </section>

      <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <strong>02 · Avatar Desk</strong>
          <span id="status" class="hint">Idle</span>
        </div>
        <div class="row">
          <button id="connect-btn" class="primary">Start Session</button>
          <button id="mic-btn" disabled>Mute Mic</button>
          <button id="cam-btn" disabled>1 FPS Camera</button>
          <button id="screen-btn" disabled>1 FPS Screen</button>
          <button id="end-btn" disabled>End Session</button>
        </div>
        <div id="warning" class="hint" style="color: #fca5a5"></div>
        <div id="transcript" aria-live="polite"></div>
        <form id="chat-form" class="row">
          <input id="chat-input" type="text" style="flex: 1" placeholder="Ask about what your camera/screen shows..." />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
