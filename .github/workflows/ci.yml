name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Go + TypeScript + Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies & Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build TypeScript ESM & Verify Lockstep Bundle
        run: |
          make bundle
          make lint

      - name: Run Hermetic Tests & Build All Examples
        run: |
          make test
          make build
